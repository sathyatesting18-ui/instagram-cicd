name: Instagram CI/CD

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # CI - TEST
  # =========================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v


  # =========================
  # CD - DEPLOY TO EC2
  # =========================
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "================================="
            echo "Starting deployment..."
            echo "================================="

            # Project directory
            cd ~/instagram-cicd

            echo "Current directory:"
            pwd

            echo "Checking project files:"
            ls -la

            echo "================================="
            echo "Pulling latest code..."
            echo "================================="

            git fetch origin main
            git reset --hard origin/main

            echo "================================="
            echo "Stopping old container..."
            echo "================================="

            sudo docker stop instagram-app || true
            sudo docker rm instagram-app || true

            echo "================================="
            echo "Removing old image..."
            echo "================================="

            sudo docker rmi instagram-app || true

            echo "================================="
            echo "Building new Docker image..."
            echo "================================="

            sudo docker build -t instagram-app .

            echo "================================="
            echo "Starting new container..."
            echo "================================="

            sudo docker run -d \
              --name instagram-app \
              -p 8080:5000 \
              --restart unless-stopped \
              instagram-app

            echo "================================="
            echo "Checking container..."
            echo "================================="

            sleep 5

            sudo docker ps

            echo "================================="
            echo "Container logs:"
            echo "================================="

            sudo docker logs --tail 50 instagram-app

            echo "================================="
            echo "Deployment completed successfully!"
            echo "================================="
